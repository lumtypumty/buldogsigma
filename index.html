<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какой ты Сигма сегодня</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('images/your-background-image.jpg'); /* Замените на путь к вашему фону */
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }
        h1 {
            position: absolute; /* Фиксируем заголовок в верхней части */
            top: 20px; /* Отступ сверху */
            font-size: 36px; /* Размер шрифта заголовка */
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: red; /* Красный цвет кнопки */
            color: white; /* Цвет текста кнопки */
            border: none; /* Убираем рамку */
            cursor: pointer; /* Курсор при наведении */
        }
        .image-container {
            display: none; /* Скрываем изображение по умолчанию */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Полупрозрачный черный фон */
            justify-content: center;
            align-items: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

    <h1>КАКОЙ ТЫ СИГМА СЕГОДНЯ</h1>
    <button id="generateChaos">ГЕНЕРИРОВАТЬ</button>

    <div class="image-container" id="imageContainer">
        <img id="randomImage" src="" alt="Случайное изображение">
    </div>

    <script>
        const images = [
            'images/image1.jpg', 
            'images/image2.jpg',
            'images/image3.jpg',
            // Добавьте остальные изображения до более чем 100
        ];

        document.getElementById('generateChaos').addEventListener('click', function() {
            const randomIndex = Math.floor(Math.random() * images.length);
            const selectedImage = images[randomIndex];
            
            document.getElementById('randomImage').src = selectedImage;

            const imageContainer = document.getElementById('imageContainer');
            imageContainer.style.display = 'flex'; // Показываем изображение
        });

        document.getElementById('imageContainer').addEventListener('click', function() {
            this.style.display = 'none'; // Скрываем изображение при клике
        });
    </script>

</body>
</html>
